components:
  schemas:
    Filme:
      required:
        - nome
        - sinopse
        - data_lancamento
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        sinopse:
          type: string
        data_lancamento:
          type: string
        duracao:
          type: string
        capa:
          type: string
        valor:
          type: string
        avaliacao:
          type: string
    Gênero:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string   
    Nacionalidade:
      required:
        - pais
      type: object
      properties:
        id:
          type: integer
        pais:
          type: string
    Classificação:
      required:
        - descricao
      type: object
      properties:
        id:
          type: integer
        descricao:
          type: string
    Sexo:
      required:
        - sigla
      type: object
      properties:
        id:
          type: integer
        sigla:
          type: string
  requestBodies:
    Aluno:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filme'
    
